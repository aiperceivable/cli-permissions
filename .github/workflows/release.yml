name: Release Corpus

# The tag is the release address; manifest.json is the identity inside the
# bytes. This workflow refuses to publish when the two disagree, when the
# version is not greater than the previous one, when the narrative section is
# missing, or when the tagged commit is not on main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release identity
        id: identity
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release ${tag}, manifest version ${version}"

      - name: Tag matches the manifest version
        run: |
          set -euo pipefail
          tag="${{ steps.identity.outputs.tag }}"
          version="${{ steps.identity.outputs.version }}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match manifest.json version ${version}." \
                 "The tag is derived from the manifest, never typed."
            exit 1
          fi

      - name: Version is greater than the previous release
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.version }}"
          tag="${{ steps.identity.outputs.tag }}"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "${tag}" | head -n 1 || true)
          if [ -z "${previous}" ]; then
            echo "No previous tag; this is the first release."
            exit 0
          fi
          highest=$(printf '%s\n%s\n' "${previous#v}" "${version}" | sort -V | tail -n 1)
          if [ "${highest}" != "${version}" ] || [ "${highest}" = "${previous#v}" ]; then
            echo "::error::${version} is not greater than the previous release ${previous}." \
                 "One version number must map to one byte sequence."
            exit 1
          fi
          echo "Previous release: ${previous}"

      - name: Changelog describes this version
        run: |
          set -euo pipefail
          version="${{ steps.identity.outputs.version }}"
          if [ ! -f CHANGELOG.md ] || ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${version}]' section." \
                 "A release with no narrative tells its users nothing about whether to adopt it."
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The tagged commit is not on main; the tag points at content nobody reviewed."
            exit 1
          fi

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install jsonschema

      - name: Regression tests
        env:
          CI_REQUIRE_SCHEMA: "1"
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build the archive
        run: |
          set -euo pipefail
          .venv/bin/python tools/package-corpus.py --check
          .venv/bin/python tools/package-corpus.py --out dist
          # Stable name so a consumer can fetch the newest release without an
          # API call: /releases/latest/download/cli-permissions.tar.gz
          cp dist/cli-permissions-v*.tar.gz dist/cli-permissions.tar.gz
          cd dist
          shasum -a 256 cli-permissions.tar.gz > cli-permissions.tar.gz.sha256

      - name: Compose release notes
        run: |
          set -euo pipefail
          tag="${{ steps.identity.outputs.tag }}"
          version="${{ steps.identity.outputs.version }}"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "${tag}" | head -n 1 || true)
          digest=$(cut -d' ' -f1 "dist/cli-permissions-v${version}.tar.gz.sha256")
          {
            echo "## Corpus ${version}"
            echo
            echo '```'
            if [ -n "${previous}" ]; then
              git diff --name-status "${previous}" "${tag}" -- overlays schemas
            else
              echo "Initial release."
            fi
            echo '```'
            echo
            awk -v ver="${version}" '
              /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Verify before installing"
            echo
            echo '```sh'
            echo "shasum -a 256 -c cli-permissions-v${version}.tar.gz.sha256"
            echo "# expected sha256: ${digest}"
            echo '```'
          } > NOTES.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.identity.outputs.tag }}"
          version="${{ steps.identity.outputs.version }}"
          gh release create "${tag}" \
            --verify-tag \
            --title "cli-permissions ${version}" \
            --notes-file NOTES.md \
            "dist/cli-permissions-v${version}.tar.gz" \
            "dist/cli-permissions-v${version}.tar.gz.sha256" \
            "dist/cli-permissions.tar.gz" \
            "dist/cli-permissions.tar.gz.sha256"
